<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="sunGrad" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff6b22"/>
      <stop offset="100%" stop-color="#a73400"/>
    </linearGradient>
    <filter id="glow" x="0" y="0" width="64" height="64" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Rounded Squircle Dark Container -->
  <rect width="64" height="64" rx="16" fill="#12161a"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#ff5400" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Glowing Central Sun Core -->
  <circle cx="32" cy="32" r="12" fill="url(#sunGrad)" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="7" fill="#ffffff" fill-opacity="0.95"/>

  <!-- Precision Engineered Solar Rays -->
  <!-- Cardinal Rays -->
  <line x1="32" y1="8" x2="32" y2="14" stroke="#ff6b22" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="50" x2="32" y2="56" stroke="#ff6b22" stroke-width="3" stroke-linecap="round"/>
  <line x1="8" y1="32" x2="14" y2="32" stroke="#ff6b22" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="32" x2="56" y2="32" stroke="#ff6b22" stroke-width="3" stroke-linecap="round"/>

  <!-- Diagonal Rays -->
  <line x1="15.03" y1="15.03" x2="19.27" y2="19.27" stroke="#ff8e4d" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="44.73" y1="44.73" x2="48.97" y2="48.97" stroke="#ff8e4d" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="15.03" y1="48.97" x2="19.27" y2="44.73" stroke="#ff8e4d" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="44.73" y1="19.27" x2="48.97" y2="15.03" stroke="#ff8e4d" stroke-width="2.5" stroke-linecap="round"/>
</svg>
